<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <rect width="880" height="340" fill="#16181d"/>
  <text x="36" y="44" font-family="-apple-system,PingFang SC,sans-serif" font-size="22" font-weight="700" fill="#f4f3f1">trainlog · 概念 B「收满圆环」</text>

  <!-- clear 态（透明）分组 -->
