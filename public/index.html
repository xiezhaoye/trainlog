<!doctype html>
<!--
  TrainLog · 砺志 — 极简首页（单页）
  重点 slogan：Log your train shape your life（大） / 勤训勤记，拒绝瞎撸（小）
  品牌：概念B 收满圆环 · 墨黑 #121214 + 伏特青柠 #a2d43f + 骨白 #f4f3f1 · condensed display。
  按钮：注册 / 登录（邮箱 OTP）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#121214" />
<meta name="description" content="TrainLog 砺志 —— 勤训勤记，拒绝瞎撸" />
<title>TrainLog · 砺志 — 勤训勤记，拒绝瞎撸</title>
<link rel="icon" type="image/svg+xml" href="logo/favicon-clear.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="砺志" />
<link rel="manifest" href="site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:      #121214;
    --line:    #26292e;
    --fg:      #f4f3f1;
    --muted:   #a9a3a0;
    --accent:  #a2d43f;
    --font-ant: "Anton","Impact","Arial Black","Avenir Next Condensed",-apple-system,sans-serif;
    --display: "Avenir Next Condensed","Avenir Next",-apple-system,"PingFang SC",system-ui,sans-serif;
    --body:    -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    --mono:    "SF Mono",Menlo,ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:100dvh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  h1,p{margin:0;}
  .wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px;flex:1;display:flex;flex-direction:column;}

  /* 顶栏 */
  header{display:flex;align-items:center;justify-content:space-between;padding-block:18px;}
  .logo{display:inline-flex;align-items:center;gap:11px;}
  .logo svg{width:30px;height:30px;}
  .logo .name{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.02em;}
  .logo .name .cn{color:var(--muted);margin-left:8px;font-weight:600;}
  .actions{display:flex;align-items:center;gap:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;
    border-radius:11px;font-family:var(--body);font-size:15px;font-weight:600;
    transition:background .15s ease,color .15s ease;}
  .btn-ghost{color:var(--muted);}
  .btn-ghost:hover{color:var(--fg);}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch,var(--accent) 90%,white);}

  /* GitHub 入口 */
  .gh-link{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;transition:background .15s ease;}
  .gh-link svg{width:26px;height:26px;fill:#2da44e;transition:fill .15s ease;}
  .gh-link:hover{background:var(--line);}
  .gh-link:hover svg{fill:color-mix(in oklch,#2da44e 88%,white);}
  .gh-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* Hero — slogan 主导屏面 */
  main{flex:1;display:flex;}
  .hero{width:100%;flex:1;display:flex;padding-block:clamp(28px,5vh,72px);}
  .center{width:100%;max-width:1080px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;flex:1;}
  .lead{margin-top:auto;}
  .ring{margin:0 auto clamp(18px,3vh,30px);}
  .ring svg{width:clamp(56px,9vw,92px);height:auto;margin-inline:auto;}
  .slogan-en{
    font-family:var(--font-ant);font-weight:400;color:var(--fg);
    font-size:clamp(40px,10.5vw,120px);
    line-height:.98;letter-spacing:.005em;margin:0;
  }
  .slogan-en .l1{display:block;}
  .slogan-en .l2{display:block;color:var(--accent);margin-top:clamp(6px,1.2vw,18px);}
  .slogan-zh{
    font-family:var(--display);font-weight:700;color:var(--muted);
    font-size:clamp(30px,7.5vw,68px);
    line-height:1.1;letter-spacing:.03em;white-space:nowrap;margin-top:24px;
  }

  /* 按钮：两行纵向，加宽，贴近屏幕底部 */
  .cta{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .cta .primary{
    width:min(360px,84vw);min-height:58px;padding:0 40px;border-radius:14px;font-size:17px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header data-od-id="topnav">
      <a class="logo" href="/" aria-label="TrainLog 砺志 · 首页">
        <svg viewBox="0 0 256 256" fill="none" aria-hidden="true">
          <circle cx="128" cy="128" r="74" stroke="#f4f3f1" stroke-width="20"/>
          <circle cx="128" cy="128" r="74" stroke="#a2d43f" stroke-width="20" stroke-dasharray="310 125" stroke-linecap="round" transform="rotate(-90 128 128)"/>
          <path d="M104 130 L122 148 L156 110" stroke="#f4f3f1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="name">TrainLog<span class="cn">砺志</span></span>
      </a>
      <nav class="actions" aria-label="账号" data-od-id="nav">
        <a class="gh-link" href="https://github.com/xiezhaoye/trainlog" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" data-od-id="nav-github">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </nav>
    </header>

    <main>
      <section class="hero" data-od-id="hero">
        <div class="center">
          <div class="lead">
            <div class="ring" aria-hidden="true">
              <svg viewBox="0 0 256 256" fill="none">
                <circle cx="128" cy="128" r="90" stroke="#2c2f34" stroke-width="16"/>
                <circle cx="128" cy="128" r="90" stroke="#a2d43f" stroke-width="16"
                        stroke-dasharray="380 186" stroke-linecap="round" transform="rotate(-90 128 128)"/>
                <path d="M102 132 L121 151 L158 111" stroke="#f4f3f1" stroke-width="15"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="slogan-en" data-od-id="slogan-en">
              <span class="l1">Log your train</span>
              <span class="l2">shape your life</span>
            </h1>
            <p class="slogan-zh" data-od-id="slogan-zh">勤训勤记，拒绝瞎撸</p>
          </div>
          <div class="cta">
            <a class="btn btn-primary primary" href="/signup" data-od-id="hero-signup">注册</a>
            <a class="btn btn-ghost primary" href="/login" data-od-id="hero-login">登录</a>
          </div>
        </div>
      </section>
    </main>
  </div>
<script src="/pwa-register.js"></script></body>
</html>
