<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#18191b" />
<script>/* EFGH 换肤启动：localStorage v2.skin → html[data-skin]，防首帧闪烁 */
(function(){var m={heat:'#f7f7f5',fire:'#121214',fresh:'#f3f8f6',efficient:'#f4f6f9'};var s=null;try{s=localStorage.getItem('v2.skin');}catch(e){}
if(s&&m[s]){document.documentElement.setAttribute('data-skin',s);var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute('content',m[s]);}})();</script>
<script src="/skin-sync.js"></script>

<title>今天 · TrainLog 砺志</title>
<link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="apple-mobile-web-app-title" content="砺志" />
<style>
/* ── 皮肤A · 竞训深色 token（v2 规范 02 号文档，oklch→hex≈） ── */
:root {
  --bg:#18191b; --surface:#232527; --raised:#2c2e31;
  --fg:#ececec; --muted:#9da1a5; --faint:#767a7e;
  --border:#35383b; --border-bright:#4a4d51;
  --accent:#a2d43f; --accent-strong:#86b52e; --on-accent:#1f2517;
  --ok:#4db06f; --danger:#ea4a4a; --warn:#d9a23f;
  --cat-res:#d99b3e; --cat-cardio:#3cb8cf;
  --ok-tint: color-mix(in oklch, var(--ok) 12%, transparent);
  --acc-tint: color-mix(in oklch, var(--accent) 14%, transparent);
  --danger-tint: color-mix(in oklch, var(--danger) 14%, transparent);
  --shadow-float: 0 18px 44px rgba(0,0,0,.5);
  --font-display: "Avenir Next Condensed","Avenir Next",-apple-system,"PingFang SC",system-ui,sans-serif;
  --font-body: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --font-mono: "SF Mono",Menlo,ui-monospace,monospace;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
}
:root { --body-bg:#0c0d0f; --app-ring:0 0 0 1px rgba(255,255,255,.04); --scrim-bg:rgba(5,6,8,.62); --seg-shadow:0 1px 4px rgba(0,0,0,.35); --ok-text:#07130b; --swatch-ring:0 0 0 1px rgba(255,255,255,.14); }
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{margin:0;height:100%;background:var(--body-bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-touch-callout:none;}
input,textarea{font:inherit;color:var(--fg);}
a{color:inherit;text-decoration:none;}
h1,h2,h3,p{margin:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── 手机壳（桌面预览时居中，手机满屏） ── */
.stage{min-height:100%;display:flex;align-items:stretch;justify-content:center;}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--app-ring);}

/* ── 顶栏 ── */
.topbar{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(10px + var(--safe-top)) 20px 14px;background:var(--bg);border-bottom:1px solid var(--border);z-index:5;}
.topbar__title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1;}
.topbar__meta{text-align:right;}
.topbar__date{font-family:var(--font-mono);font-size:17px;color:var(--fg);font-weight:600;}
.topbar__wk{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em;margin-top:3px;}

/* ── 内容区（唯一滚动） ── */
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 20px calc(24px + var(--safe-bottom));}
.content::-webkit-scrollbar{width:0;}

/* ── 进度环 ── */
.progress{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:4px 2px 6px;}
.progress__head{font-family:var(--font-display);font-size:19px;font-weight:700;white-space:nowrap;}
.ring{position:relative;width:154px;height:154px;flex:none;}
.ring svg{display:block;transform:rotate(-90deg);}
.ring__track{stroke:var(--border);}
.ring__fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.2,1);}
.ring__center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.ring__num{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;}
.ring__num small{font-size:18px;font-weight:700;color:var(--faint);letter-spacing:0;}
.ring__label{font-family:var(--font-mono);font-size:9.5px;color:var(--faint);letter-spacing:.08em;margin-top:5px;}
.progress__sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}

/* ── 区块标题 ── */
.section-label{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;}
.section-label__name{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.14em;}
.section-label__count{font-family:var(--font-mono);font-size:11px;color:var(--faint);}

/* ── 动作行 ── */
.action-row{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 4px;border-top:1px solid var(--border);}
.action-row:last-of-type{border-bottom:1px solid var(--border);}
.action-row.is-done{background:var(--ok-tint);margin:0 -4px;padding-inline:8px;border-radius:12px;border-color:transparent;}
.action-row.is-done + .action-row.is-done{margin-top:2px;}
.tag{flex:none;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;padding:6px 8px;border-radius:8px;line-height:1;}
.tag--res{background:color-mix(in oklch,var(--cat-res) 16%,transparent);color:var(--cat-res);}
.tag--cardio{background:color-mix(in oklch,var(--cat-cardio) 16%,transparent);color:var(--cat-cardio);}
.action-row__info{flex:1;min-width:0;}
.action-row__name{font-size:16px;font-weight:600;text-wrap:balance;}
.action-row.is-done .action-row__name{color:var(--ok);}
.action-row__meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:2px;}
.action-row__right{flex:none;display:flex;align-items:center;gap:10px;}
.done-pill{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-size:13px;font-weight:600;}
.done-pill svg{width:14px;height:14px;}
.btn-go{min-height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,transform .06s ease;}
.btn-go:hover{background:var(--accent-strong);}
.btn-go:active{transform:translateY(1px);}
.btn-view{min-height:44px;padding:0 18px;border-radius:12px;background:transparent;color:var(--fg);border:1px solid var(--border-bright);
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s ease;}
.btn-view:hover{border-color:var(--accent);color:var(--accent);}

/* ── 空态 ── */
.empty{padding:56px 8px;text-align:center;color:var(--faint);}
.empty__text{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;line-height:1.8;}
.empty__cta{display:inline-flex;min-height:44px;align-items:center;justify-content:center;margin-top:18px;padding:0 20px;border:1px solid var(--accent);border-radius:12px;color:var(--accent);font-size:14px;font-weight:600;}
.empty__cta:hover{background:var(--acc-tint);}
.empty__cta--alt{margin-left:8px;border-color:var(--border-bright);color:var(--fg);}
.empty__cta--alt:hover{border-color:var(--accent);color:var(--accent);background:transparent;}
.empty__cta--alt .go{color:var(--accent);}

/* ── 底部停靠区 ── */
.dock{flex:none;background:var(--bg);}
.actionbar{display:flex;gap:10px;padding:10px 20px 8px;}
.btn-primary{flex:1;min-height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease,transform .06s ease;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-primary:active{transform:translateY(1px);}
.btn-primary:disabled{background:var(--border);color:var(--faint);cursor:not-allowed;box-shadow:none;}
.btn-primary.is-completed{background:var(--ok);color:var(--ok-text);}
.btn-ghost-big{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--border-bright);color:var(--fg);font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s ease,color .15s ease;}
.btn-ghost-big:hover{border-color:var(--accent);color:var(--accent);}
.tabbar{display:flex;border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);background:var(--bg);}
.tabbar__btn{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;transition:color .15s ease;}
.tabbar__btn svg{width:20px;height:20px;}
.tabbar__btn.is-active{color:var(--accent);}

/* ── 浮层通用 ── */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim-bg);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s ease;}
.scrim.is-open{opacity:1;pointer-events:auto;}
.surface{background:var(--surface);border:1px solid var(--border);border-radius:16px;}
.modal{position:absolute;left:12px;right:12px;top:50%;transform:translateY(calc(-50% + 12px)) scale(.98);z-index:41;padding:22px;box-shadow:var(--shadow-float);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;}
.modal.is-open{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
.modal__icon{width:46px;height:46px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--acc-tint);color:var(--accent);}
.modal__icon svg{width:22px;height:22px;}
.modal__title{text-align:center;font-size:18px;font-weight:700;letter-spacing:-.005em;}
.modal__sub{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--faint);margin-top:5px;letter-spacing:.06em;}
.modal__actions{display:flex;gap:10px;margin-top:20px;}
.btn-primary-sm{flex:1;min-height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;}
.btn-primary-sm:hover{background:var(--accent-strong);}
.btn-ghost-sm{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--border-bright);color:var(--fg);font-size:15px;font-weight:600;}
.btn-ghost-sm:hover{border-color:var(--accent);color:var(--accent);}

/* ── 完成训练浮层 ── */
.session-list{border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:16px 0 14px;}
.session-ex{display:flex;align-items:center;gap:8px;padding:10px 2px;font-size:14px;color:var(--muted);border-top:1px solid var(--border);}
.session-ex:first-child{border-top:0;}
.session-ex svg{width:14px;height:14px;color:var(--ok);flex:none;}
.mood-label{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 10px;}
.mood-seg{display:flex;background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:4px;}
.mood-item{flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:9px;color:var(--muted);font-size:12px;transition:background .15s ease,color .15s ease;}
.mood-item.is-active{background:var(--acc-tint);color:var(--accent);font-weight:700;}
.mood-item__emoji{font-size:16px;line-height:1;}
.send-row{display:flex;align-items:center;gap:10px;padding:11px 2px;font-size:15px;color:var(--fg);cursor:pointer;border-top:1px solid var(--border);}
.send-row:first-of-type{border-top:0;}
.send-row input{width:20px;height:20px;accent-color:var(--accent);}

/* ── 新增训练 sheet ── */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;border-radius:20px 20px 0 0;background:var(--surface);box-shadow:var(--shadow-float);
  max-height:86%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);}
.sheet.is-open{transform:translateY(0);}
.sheet__grab{width:36px;height:4px;border-radius:99px;background:var(--border-bright);margin:10px auto 4px;}
.sheet__head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;}
.sheet__title{font-size:17px;font-weight:700;}
.sheet__close{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:12px;}
.sheet__close:hover{color:var(--fg);}
.sheet__body{flex:1;min-height:0;overflow-y:auto;padding:0 20px 16px;-webkit-overflow-scrolling:touch;}
.sheet__foot{flex:none;display:flex;padding:10px 20px calc(10px + var(--safe-bottom));border-top:1px solid var(--border);}
.segmented{display:flex;background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:4px;}
.segmented button{flex:1;min-height:42px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:600;transition:background .15s ease,color .15s ease;}
.segmented button.is-active{background:var(--bg);color:var(--fg);box-shadow:var(--seg-shadow);}
.sheet-hint{font-size:13px;color:var(--faint);margin:14px 2px 2px;line-height:1.5;}
.group-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.12em;margin:16px 2px 10px;}
.pick-chips{display:flex;flex-wrap:wrap;gap:8px;}
.pick-chip{min-height:40px;padding:0 16px;border-radius:12px;background:var(--raised);border:1px solid var(--border-bright);color:var(--fg);font-size:14px;font-weight:600;transition:all .15s ease;}
.pick-chip:hover{border-color:var(--accent);}
.pick-chip.is-on{background:var(--acc-tint);border-color:var(--accent);color:var(--accent);}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--raised);border:1px solid var(--border);border-radius:12px;margin-top:10px;}
.stepper__btn{width:52px;min-height:48px;color:var(--fg);font-size:22px;display:grid;place-items:center;border-radius:12px;}
.stepper__btn:hover{color:var(--accent);}
.stepper__value{font-family:var(--font-mono);font-size:16px;color:var(--accent);font-weight:700;}

/* ── toast ── */
.toast{position:absolute;left:14px;right:14px;top:calc(var(--safe-top) + 10px);z-index:60;background:var(--raised);border:1px solid var(--border-bright);
  border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;color:var(--fg);text-align:center;
  opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
.toast.is-in{opacity:1;transform:translateY(0);}
.toast.is-err{border-color: var(--danger);color:var(--danger);}

/* ═══ EFGH 换肤：data-skin 在 <html> 上，覆盖 :root 全部 token ═══ */
html[data-skin="heat"]{--bg:#f7f7f5;--surface:#ffffff;--raised:#eef0ec;--fg:#201f1c;--muted:#5f5b55;--faint:#7b7670;--border:#d9dcda;--border-bright:#bcc3c0;--accent:#cf4409;--accent-strong:#a83a06;--on-accent:#ffffff;--ok:#178745;--danger:#d31f1f;--warn:#a06a0a;--cat-res:#a8550b;--cat-cardio:#0e7490;--ok-tint:color-mix(in oklch,var(--ok) 12%,transparent);--acc-tint:color-mix(in oklch,var(--accent) 14%,transparent);--danger-tint:color-mix(in oklch,var(--danger) 14%,transparent);--shadow-float:0 18px 44px rgba(28,24,18,.18);--body-bg:#ece9e4;--app-ring:0 0 0 1px rgba(23,30,27,.08);--scrim-bg:rgba(20,26,24,.38);--seg-shadow:0 1px 4px rgba(23,30,27,.14);--ok-text:#ffffff;--swatch-ring:0 0 0 1px rgba(23,30,27,.22);}
html[data-skin="heat"] .ring__num,html[data-skin="heat"] .stat-tile__num,html[data-skin="heat"] .set-view-row__weight,html[data-skin="heat"] .set-view-row__reps,html[data-skin="heat"] .cardio-view__num,html[data-skin="heat"] .stepper__value,html[data-skin="heat"] .cal-cell__num{font-weight:900;}

html[data-skin="fresh"]{--bg:#f3f8f6;--surface:#ffffff;--raised:#eef3f0;--fg:#1c2321;--muted:#59625f;--faint:#6f7874;--border:#e4e9e6;--border-bright:#cfd7d3;--accent:#26794a;--accent-strong:#1f633b;--on-accent:#ffffff;--ok:#15803c;--danger:#cf4436;--warn:#97660f;--cat-res:#8a6510;--cat-cardio:#1f6f78;--ok-tint:color-mix(in oklch,var(--ok) 12%,transparent);--acc-tint:color-mix(in oklch,var(--accent) 14%,transparent);--danger-tint:color-mix(in oklch,var(--danger) 14%,transparent);--shadow-float:0 18px 44px rgba(31,42,38,.12);--body-bg:#dfe8e3;--app-ring:0 0 0 1px rgba(31,42,38,.05);--scrim-bg:rgba(20,26,24,.38);--seg-shadow:0 1px 4px rgba(31,42,38,.09);--ok-text:#ffffff;--swatch-ring:0 0 0 1px rgba(31,42,38,.16);}
html[data-skin="efficient"]{--bg:#f4f6f9;--surface:#ffffff;--raised:#e9edf3;--fg:#1c2028;--muted:#5a616b;--faint:#717a85;--border:#e3e7ee;--border-bright:#c2cad5;--accent:#3a62d6;--accent-strong:#234aa0;--on-accent:#ffffff;--ok:#2353b8;--danger:#cf4436;--warn:#99630f;--cat-res:#8a5f12;--cat-cardio:#3561ad;--ok-tint:color-mix(in oklch,var(--ok) 12%,transparent);--acc-tint:color-mix(in oklch,var(--accent) 14%,transparent);--danger-tint:color-mix(in oklch,var(--danger) 14%,transparent);--shadow-float:0 18px 44px rgba(23,30,40,.12);--body-bg:#e9edf4;--app-ring:0 0 0 1px rgba(23,30,40,.05);--scrim-bg:rgba(20,26,24,.38);--seg-shadow:0 1px 4px rgba(23,30,40,.10);--ok-text:#ffffff;--swatch-ring:0 0 0 1px rgba(23,30,40,.16);}
html[data-skin="efficient"] .action-row,html[data-skin="efficient"] .set-row,html[data-skin="efficient"] .session-ex,html[data-skin="efficient"] .schedule-row,html[data-skin="efficient"] .set-view-row,html[data-skin="efficient"] .setting-row,html[data-skin="efficient"] .plan-row{border-color:color-mix(in oklch,var(--border) 55%,var(--bg) 45%);}
html[data-skin="efficient"] .topbar,html[data-skin="efficient"] .dock,html[data-skin="efficient"] .bottom-bar,html[data-skin="efficient"] .tabbar,html[data-skin="efficient"] .cal-card,html[data-skin="efficient"] .day-card,html[data-skin="efficient"] .set-card,html[data-skin="efficient"] .note-card,html[data-skin="efficient"] .modal,html[data-skin="efficient"] .sheet,html[data-skin="efficient"] .surface,html[data-skin="efficient"] .card{border-color:color-mix(in oklch,var(--border) 70%,var(--bg) 30%);}
html[data-skin="efficient"] .ring__num,html[data-skin="efficient"] .stat-tile__num,html[data-skin="efficient"] .set-view-row__weight,html[data-skin="efficient"] .set-view-row__reps,html[data-skin="efficient"] .cardio-view__num,html[data-skin="efficient"] .stepper__value,html[data-skin="efficient"] .cal-cell__num{letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

</style>

<body data-skin="athletic">
<div class="stage">
  <div class="app" data-od-id="home-page">
    <header class="topbar" data-od-id="home-topbar">
      <div class="topbar__title">今天</div>
      <div class="topbar__meta">
        <div class="topbar__date" id="dateLabel">8月26日 · 周三</div>
        <div class="topbar__wk" id="weekLabel" style="display:none;">WED · WEEK 35</div>
      </div>
    </header>

    <main class="content">
      <section class="progress" data-od-id="home-progress">
        <div class="progress__head" id="progressHead">今日训练 · 已完成 0 项</div>
        <div class="ring" data-od-id="progress-ring">
          <svg width="154" height="154" viewBox="0 0 154 154" aria-hidden="true">
            <circle class="ring__track" cx="77" cy="77" r="64" fill="none" stroke-width="12"/>
            <circle class="ring__fill" id="ringFill" cx="77" cy="77" r="64" fill="none" stroke-width="12" stroke-dasharray="402.12" stroke-dashoffset="402.12"/>
          </svg>
          <div class="ring__center">
            <div class="ring__num"><span id="doneNum">0</span><span id="totalNum"><small> / 0</small></span></div>
            <div class="ring__label">已完成</div>
          </div>
        </div>
        <div class="progress__sub" id="progressSub">收满圆环即完成</div>
      </section>

      <div class="section-label" data-od-id="plan-label">
        <span class="section-label__name">训练安排</span>
        <span class="section-label__count" id="counts">0 / 0 已完成</span>
      </div>
      <div id="planList" data-od-id="plan-list"></div>
    </main>

    <footer class="dock">
      <div class="actionbar" data-od-id="home-actionbar">
        <button class="btn-ghost-big" id="addBtn" type="button" data-od-id="add-training-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增动作
        </button>
        <button class="btn-primary" id="finishBtn" type="button" disabled data-od-id="finish-session-btn">完成训练</button>
      </div>
      <nav class="tabbar" data-od-id="tabbar">
        <a class="tabbar__btn is-active" href="app.html" data-od-id="tab-today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
          今天
        </a>
        <a class="tabbar__btn" href="records.html" data-od-id="tab-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3.5v3M16 3.5v3"/></svg>
          记录
        </a>
        <a class="tabbar__btn" href="settings.html" data-od-id="tab-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
          模板
        </a>
        <a class="tabbar__btn" href="me.html" data-od-id="tab-me">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.6-3.2 4.2-5 7-5s5.4 1.8 7 5"/></svg>
          我的
        </a>
      </nav>
    </footer>

    <!-- 完成训练浮层 -->
    <div class="scrim" id="sessionScrim" role="dialog" aria-modal="true" aria-label="完成本次训练"></div>
    <div class="modal surface" id="sessionModal" data-od-id="complete-modal" role="dialog" aria-modal="true" aria-label="完成本次训练">
      <div class="modal__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
      <div class="modal__title">完成本次训练？</div>
      <div class="session-list" id="sessionList"></div>
      <div class="mood-label">本次训练感受</div>
      <div class="mood-seg" id="moodSeg" data-od-id="mood-seg">
        <button class="mood-item" type="button" data-mood="0"><span class="mood-item__emoji">😕</span>较差</button>
        <button class="mood-item is-active" type="button" data-mood="1"><span class="mood-item__emoji">🙂</span>正常</button>
        <button class="mood-item" type="button" data-mood="2"><span class="mood-item__emoji">🤩</span>很棒</button>
      </div>
      <label class="send-row" id="syncPlanRow" style="display:none;"><input type="checkbox" id="syncPlan" /><span>同步到计划</span></label>
      <div class="modal__actions">
        <button class="btn-ghost-sm" id="sessionCancel" type="button">取消</button>
        <button class="btn-primary-sm" id="sessionConfirm" type="button">完成训练</button>
      </div>
    </div>

    <!-- 新增训练 sheet -->
    <div class="scrim" id="addScrim" role="dialog" aria-modal="true" aria-label="新增训练" data-od-id="add-sheet-scrim"></div>
    <div class="sheet surface" id="addSheet" data-od-id="add-sheet" role="dialog" aria-modal="true" aria-label="新增训练">
      <div class="sheet__grab"></div>
      <div class="sheet__head">
        <div class="sheet__title">新增训练</div>
        <button class="sheet__close" id="addClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet__body">
        <div class="segmented" id="typeSeg" data-active="resistance" data-od-id="add-type-seg">
          <button class="is-active" type="button" data-type="resistance">抗阻</button>
          <button type="button" data-type="cardio">有氧</button>
        </div>
        <div class="sheet-hint">挑选想要的动作，加入今日训练安排。选中后再点一下可取消。</div>
        <div id="resistBlock">
          <div class="group-label">选择部位</div>
          <div class="pick-chips" id="partSel"></div>
          <div class="group-label" id="actionLabel" style="display:none;">选择动作</div>
          <div class="pick-chips" id="actionSel"></div>
        </div>
        <div id="cardioBlock" style="display:none;">
          <div class="group-label">选择有氧动作</div>
          <div class="pick-chips" id="cardioSel"></div>
          <div class="group-label">时长（分钟）</div>
          <div class="stepper">
            <button class="stepper__btn" id="durMinus" type="button" aria-label="减少时长">－</button>
            <span class="stepper__value" id="durValue">30</span>
            <button class="stepper__btn" id="durPlus" type="button" aria-label="增加时长">＋</button>
          </div>
        </div>
      </div>
      <div class="sheet__foot">
        <button class="btn-primary" id="addConfirm" type="button" disabled data-od-id="add-confirm-btn">新增动作</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="assets/app.js"></script>
<script src="v2-bridge.js"></script>
<script>
(function(){
  'use strict';
  var W = window.Workout, V2 = window.V2;
  var today = V2.today();

  // 数据全部来自真实后端（V2 桥接 window.Workout）
  var actions = [], m = { completed: false, mood: 1 };
  function refresh(){
    actions = V2.actionsFor(today);
    m = V2.metaOf(today);
  }

  function load(){ return actions; }
  function meta(){ return m; }
  function saveActions(a){ /* 由 V2.addActions/saveAction 落库，这里同步内存 */ actions = a; }
  function saveMeta(mm){ /* 由 V2.completeSession 落库 */ m = mm; }
  function go(id){ location.href='execute-resistance.html?a='+encodeURIComponent(id); }

  var actions = load(), m = meta(), hydrated = false;
  if(Object.keys(m).length === 0 && !localStorage.getItem(MKEY)){ m={completed:false}; saveMeta(m); }

  var toast = document.getElementById('toast'), toastTimer;
  function toastMsg(msg, isErr){
    toast.textContent = msg;
    toast.classList.toggle('is-err', !!isErr);
    toast.classList.add('is-in');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('is-in'); }, 2400);
  }
  var pendingToast = null;
  try{ pendingToast = sessionStorage.getItem('v2.toast'); sessionStorage.removeItem('v2.toast'); }catch(e){}
  if(pendingToast) setTimeout(function(){ toastMsg(pendingToast); }, 350);

  var pad = function(n){ return String(n).padStart(2,'0'); };
  var d = new Date();
  document.getElementById('dateLabel').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 · 周' + ['日','一','二','三','四','五','六'][d.getDay()];

  var MOOD_LABEL = ['较差','正常','很棒'];
  function setMeta(k,v){ m[k]=v; /* 整场完成由 V2.completeSession 落库 */ }

  function metaOf(a){ return a.type==='cardio'
    ? a.duration + ' 分钟'
    : ((a.sets&&a.sets.length) ? a.sets.length + ' 组' : ((a.plan_sets||0) + ' 组')); }

  function rowHTML(a){
    var isCardio = a.type==='cardio';
    var tag = '<span class="tag '+(isCardio?'tag--cardio':'tag--res')+'">'+(isCardio?'有氧':(a.part||'抗阻'))+'</span>';
    var right;
    if(a.done){
      right = '<span class="done-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>已完成</span>'+
        '<button class="btn-view" type="button" data-go="'+a.id+'">查看</button>';
    } else {
      right = '<button class="btn-go" type="button" data-go="'+a.id+'">去训练</button>';
    }
    return '<article class="action-row'+(a.done?' is-done':'')+'" data-od-id="action-row-'+a.id+'">'+
      tag+
      '<div class="action-row__info">'+
        '<div class="action-row__name">'+a.name+'</div>'+
        '<div class="action-row__meta">'+metaOf(a)+'</div>'+
      '</div>'+
      '<div class="action-row__right">'+right+'</div>'+
    '</article>';
  }

  function render(){
    var listEl = document.getElementById('planList');
    var done = actions.filter(function(a){return a.done;}).length;
    var total = actions.length;
    var allDone = total>0 && done===total;
    var CIRC=402.12;
    document.getElementById('doneNum').textContent = done;
    document.getElementById('totalNum').innerHTML = '<small> / '+total+'</small>';
    document.getElementById('ringFill').style.strokeDashoffset = String(total? CIRC*(1-done/total) : CIRC);
    var remaining = total - done;
    var head;
    if(m.completed){ head = '整场完成，太棒了！'; }
    else if(!total){ head = '今天还没有训练，新增一次吧'; }
    else if(allDone){ head = '全部完成，点「完成训练」收满圆环！'; }
    else { head = '加油完成剩下的'+remaining+'项！'; }
    document.getElementById('progressHead').textContent = head;
    document.getElementById('progressSub').textContent = '';
    document.getElementById('counts').textContent = done+' / '+total+' 已完成';
    listEl.innerHTML = actions.map(rowHTML).join('') || emptyHTML();
    listEl.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ go(b.getAttribute('data-go')); }); });
    var ea = document.getElementById('emptyAdd');
    if(ea) ea.addEventListener('click', openSheet);
    var ed = document.getElementById('emptyDemo');
    if(ed) ed.addEventListener('click', addDemoAction);

    var fin = document.getElementById('finishBtn');
    if(m.completed){ fin.className='btn-primary is-completed'; fin.disabled=true; fin.textContent='训练已完成 ✓'; }
    else { fin.className='btn-primary'; fin.disabled=!allDone; fin.textContent='完成训练'; }

    // 训练安排右上同步到计划候选
    var hasPlan = actions.some(function(a){ return a.src==='tpl'; });
    document.getElementById('syncPlanRow').style.display = (hasPlan && !m.completed) ? 'flex' : 'none';
    if(!hasPlan || m.completed){ document.getElementById('syncPlan').checked = false; }
  }
  function emptyHTML(){
    return '<div class="empty" data-od-id="plan-empty">'+
      '<div class="empty__text">这一天还没有安排<br/>点下方「新增动作」开始一次训练</div>'+
      '<button class="empty__cta" id="emptyAdd" type="button">＋ 新增动作</button>'+
      '<button class="empty__cta empty__cta--alt" id="emptyDemo" type="button">载入演示动作 · 进入训练页</button>'+
    '</div>';
  }
  function addDemoAction(){
    var na={type:'resistance', part:'胸', name:'哑铃卧推', plan_sets:3, done:false, notes:'', sets:[{weight_kg:20,is_bodyweight:false,reps:10,done:false},{weight_kg:20,is_bodyweight:false,reps:8,done:false}]};
    V2.addActions(today, [na]).then(function(){
      refresh(); render();
      if(actions.length){ go(actions[actions.length-1].id); }
    });
  }

  /* ── 完成训练浮层 ── */
  var mood = 1;
  var moodSeg = document.getElementById('moodSeg');
  function renderMood(){
    moodSeg.querySelectorAll('.mood-item').forEach(function(b){ b.classList.toggle('is-active', Number(b.getAttribute('data-mood'))===mood); });
  }
  moodSeg.addEventListener('click', function(e){
    var b = e.target.closest('.mood-item'); if(!b) return;
    mood = Number(b.getAttribute('data-mood')); renderMood();
  });
  document.getElementById('finishBtn').addEventListener('click', function(){
    document.getElementById('sessionList').innerHTML = actions.map(function(a){
      return '<div class="session-ex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'+(a.type==='cardio'?('有氧 · '+a.name):(a.part+' · '+a.name))+'</div>';
    }).join('');
    renderMood();
    openModal('sessionScrim','sessionModal');
  });
  document.getElementById('sessionCancel').addEventListener('click', function(){ closeModal('sessionScrim','sessionModal'); });
  document.getElementById('sessionScrim').addEventListener('click', function(){ closeModal('sessionScrim','sessionModal'); });
  document.getElementById('sessionConfirm').addEventListener('click', function(){
    var sendPlan = document.getElementById('syncPlan').checked;
    closeModal('sessionScrim','sessionModal');
    V2.completeSession(today, mood, sendPlan).then(function(){
      refresh(); render();
      var planMsg = sendPlan ? ' · 已同步到计划' : '';
      toastMsg('训练已完成 · 本次感受：'+MOOD_LABEL[mood]+planMsg);
    }).catch(function(e){ toastMsg('完成训练失败：'+((e&&e.message)||'请重试'), true); });
  });

  /* ── 新增训练 sheet（动作库来自后端，V2.ready 后填充） ── */
  var PARTS = [];
  var CARDIO_ACTIONS = W.CARDIO_ACTIONS || ['跑步机慢跑','室外慢跑'];
  var tplType = 'resistance', selPart = '', selActs = {}, selCardio = {}, cardioDur = 30;

  function renderAddPage(){
    var ts = document.getElementById('typeSeg');
    document.querySelectorAll('#typeSeg button').forEach(function(b){ b.classList.toggle('is-active', b.getAttribute('data-type')===tplType); });
    document.getElementById('resistBlock').style.display = tplType==='resistance' ? 'block' : 'none';
    document.getElementById('cardioBlock').style.display = tplType==='cardio' ? 'block' : 'none';
    if(tplType==='cardio'){
      document.getElementById('cardioSel').innerHTML = CARDIO_ACTIONS.map(function(a){
        return '<button class="pick-chip'+(selCardio[a]?' is-on':'')+'" type="button" data-name="'+a+'">'+a+'</button>';
      }).join('');
      document.getElementById('cardioSel').querySelectorAll('.pick-chip').forEach(function(c){
        c.addEventListener('click', function(){ selCardio[c.getAttribute('data-name')] = !selCardio[c.getAttribute('data-name')]; renderAddPage(); });
      });
      document.getElementById('durValue').textContent = cardioDur;
    } else {
      document.getElementById('partSel').innerHTML = PARTS.map(function(p){
        return '<button class="pick-chip'+(selPart===p.name?' is-on':'')+'" type="button" data-part="'+p.name+'">'+p.name+'</button>';
      }).join('');
      document.getElementById('partSel').querySelectorAll('.pick-chip').forEach(function(c){
        c.addEventListener('click', function(){ selPart = selPart===c.getAttribute('data-part') ? '' : c.getAttribute('data-part'); renderAddPage(); });
      });
      var lib = null; PARTS.forEach(function(p){ if(p.name===selPart) lib=p; });
      var label = document.getElementById('actionLabel');
      var box = document.getElementById('actionSel');
      if(!lib){ label.style.display='none'; box.innerHTML=''; }
      else{
        label.style.display='block'; label.textContent='选择动作 · '+selPart;
        box.innerHTML = lib.actions.map(function(a){
          return '<button class="pick-chip'+(selActs[selPart+'|'+a]?' is-on':'')+'" type="button" data-name="'+a+'">'+a+'</button>';
        }).join('');
        box.querySelectorAll('.pick-chip').forEach(function(c){
          c.addEventListener('click', function(){ var n=c.getAttribute('data-name'); selActs[selPart+'|'+n]=!selActs[selPart+'|'+n]; renderAddPage(); });
        });
      }
    }
    updateAddBtn();
  }
  function updateAddBtn(){
    var n=0;
    Object.keys(selActs).forEach(function(k){ if(selActs[k]) n++; });
    Object.keys(selCardio).forEach(function(k){ if(selCardio[k]) n++; });
    var btn = document.getElementById('addConfirm');
    btn.disabled = n===0;
    btn.textContent = n>0 ? '新增 '+n+' 个动作' : '新增动作';
  }
  document.getElementById('addBtn').addEventListener('click', function(){ renderAddPage(); openSheet(); });
  document.getElementById('addClose').addEventListener('click', closeSheet);
  document.getElementById('addScrim').addEventListener('click', closeSheet);
  document.querySelectorAll('#typeSeg button').forEach(function(b){
    b.addEventListener('click', function(){ tplType = b.getAttribute('data-type'); renderAddPage(); });
  });
  document.getElementById('durMinus').addEventListener('click', function(){ cardioDur = Math.max(15, cardioDur-5); document.getElementById('durValue').textContent=cardioDur; });
  document.getElementById('durPlus').addEventListener('click', function(){ cardioDur = Math.min(120, cardioDur+5); document.getElementById('durValue').textContent=cardioDur; });
  document.getElementById('addConfirm').addEventListener('click', function(){
    var toAdd = [];
    Object.keys(selActs).forEach(function(k){
      if(!selActs[k]) return;
      var p=k.split('|')[0], n=k.split('|')[1];
      toAdd.push({type:'resistance', part:p, name:n, plan_sets:3, done:false, notes:'', sets:[]});
    });
    Object.keys(selCardio).forEach(function(k){
      if(!selCardio[k]) return;
      toAdd.push({type:'cardio', part:'有氧', name:k, done:false, duration:cardioDur, notes:'', sets:[]});
    });
    var added = toAdd.length;
    closeSheet();
    selActs={}; selCardio={}; selPart=''; tplType='resistance'; cardioDur=30;
    if(!added) return;
    V2.addActions(today, toAdd).then(function(){
      refresh(); render();
      toastMsg('已新增 '+added+' 个动作到今日安排');
    }).catch(function(e){ toastMsg('新增失败：'+((e&&e.message)||'请重试'), true); });
  });

  function openSheet(){ document.getElementById('addSheet').classList.add('is-open'); document.getElementById('addScrim').classList.add('is-open'); }
  function closeSheet(){ document.getElementById('addSheet').classList.remove('is-open'); document.getElementById('addScrim').classList.remove('is-open'); }
  function openModal(scrim, modal){ document.getElementById(scrim).classList.add('is-open'); document.getElementById(modal).classList.add('is-open'); }
  function closeModal(scrim, modal){ document.getElementById(scrim).classList.remove('is-open'); document.getElementById(modal).classList.remove('is-open'); }

  // 数据从后端加载完成后渲染
  V2.ready.then(function(){
    refresh();
    PARTS = V2.library();
    mood = m.mood != null ? m.mood : 1;
    renderMood();
    render();
  }).catch(function(e){ toastMsg('数据加载失败：'+((e&&e.message)||'请刷新重试'), true); });
})();
</script>
<script src="/pwa-register.js"></script></body>
